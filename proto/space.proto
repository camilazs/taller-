syntax = "proto3";
package spaceai;
service ProjectService {
 rpc CreateProject(CreateProjectRequest) returns (Project);
 rpc GetProjects(Empty) returns (ProjectList);
 rpc GetProject(ProjectId) returns (Project);
 rpc SaveScene(SaveSceneRequest) returns (SceneResponse);
 rpc GetScene(ProjectId) returns (SceneResponse);
 rpc DeleteProject(ProjectId) returns (Empty);
 rpc StoreModelAsset(StoreModelRequest) returns (ModelAsset);
 rpc GetModelAsset(ModelAssetRequest) returns (ModelAsset);
}
message Empty {}
message ProjectId { string id = 1; }
message CreateProjectRequest { string name = 1; }
message Project { string id = 1; string name = 2; string createdAt = 3; string updatedAt = 4; }
message ProjectList { repeated Project projects = 1; }
// Scene JSON is validated against the shared Zod schema on every write.
message SaveSceneRequest { string id = 1; string sceneJson = 2; }
message SceneResponse { string id = 1; string sceneJson = 2; }
message StoreModelRequest { string id = 1; string url = 2; }
message ModelAssetRequest { string id = 1; bool metadataOnly = 2; }
message ModelAsset { string id = 1; bytes content = 2; uint32 size = 3; }
